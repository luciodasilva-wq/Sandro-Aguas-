<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef5f7;--surface:#fff;--ink:#0c2a33;--muted:#5b7580;--line:#d3e2e7;--brand:#0a6f8f;--brandink:#fff;--ok:#12805c;--warn:#b45309;--bad:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a20;--surface:#12262e;--ink:#e6f2f5;--muted:#8fa9b3;--line:#24404a;--brand:#4cc3e6;--brandink:#06222b;--ok:#4ed1a1;--warn:#f0a95b;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0b1a20;--surface:#12262e;--ink:#e6f2f5;--muted:#8fa9b3;--line:#24404a;--brand:#4cc3e6;--brandink:#06222b;--ok:#4ed1a1;--warn:#f0a95b;--bad:#ff8a7a}
html{font-size:120%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{padding:16px 16px 4px}
h1{font-size:1.4rem;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--brand);color:var(--brandink);border-color:var(--brand);font-weight:700}
main{padding:4px 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem}
.stat span{color:var(--muted);font-size:.82rem}
label{display:block;font-size:.82rem;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--brand);color:var(--brandink);font:inherit;font-weight:700;cursor:pointer}
.sm{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 9px;font:inherit;font-size:.8rem;cursor:pointer}
.sm.del{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.row:first-of-type{border-top:0}
.row small{color:var(--muted);display:block}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.empty{color:var(--muted);padding:6px 0}
.r{text-align:right;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl input{width:78px;padding:6px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.9rem;margin-top:10px}
.chk input{width:auto}
</style>
</head>

<script>
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fdate=s=>s.split('-').reverse().join('/');
const seed=()=>({products:[
 {id:'p1',name:'Água mineral (garrafão 20 L)',price:12,cost:7,stock:30,min:10},
 {id:'p2',name:'Água adicionada de sais (garrafão 20 L)',price:12,cost:7,stock:30,min:10}],
 customers:[],suppliers:[],sales:[],purchases:[]});
function load(){try{const r=localStorage.getItem('gestao-aguas');if(r)return JSON.parse(r)}catch(e){}return seed()}
let cloud=null,queue=Promise.resolve(),lastSaved={},cloudStatus='local',pre=null,editingP=null,preSale=null,addingP=null;
let S=load(),tab='painel';S.orders=S.orders||[];S.vas=S.vas||0;
(function(){const a=S.products.find(p=>p.id==='p1'&&p.name==='Garrafão de água 20 L'),b=S.products.find(p=>p.id==='p2'&&p.name.startsWith('Água mineral (fardo')),c=S.products.find(p=>p.id==='p3'&&p.name==='Sais minerais');
 if(a)a.name='Água mineral (garrafão 20 L)';
 if(b){b.name='Água adicionada de sais (garrafão 20 L)';b.price=a?a.price:12;b.cost=a?a.cost:7}
 if(c){S.products=S.products.filter(p=>p.id!=='p3');S.orders.forEach(o=>{if(o.status==='pendente'){o.items=o.items.filter(i=>i.pid!=='p3');if(!o.items.length)o.status='cancelado'}})}
 save()})();
function save(){try{localStorage.setItem('gestao-aguas',JSON.stringify(S))}catch(e){}if(cloud){cloudStatus='saving';paintStatus();queue=queue.then(cloudSave)}}
function paintStatus(){const e=document.getElementById('st');if(!e)return;const m={local:'Salvo só neste aparelho',saving:'Salvando na nuvem…',cloud:'Salvo na nuvem',error:'Não foi possível salvar na nuvem. Tente novamente.'};e.textContent=(cloudStatus==='cloud'?'☁ ':'')+m[cloudStatus]}
function docsOf(){
 const d={'app/products':S.products,'app/customers':S.customers,'app/suppliers':S.suppliers,'app/settings':{vas:S.vas||0}};
 [['sales',S.sales],['purchases',S.purchases]].forEach(([k,arr])=>{const m={};Object.keys(lastSaved).filter(p=>p.startsWith(k+'/')).forEach(p=>m[p.split('/')[1]]=[]);arr.forEach(x=>{const mm=x.date.slice(0,7);(m[mm]=m[mm]||[]).push(x)});for(const mm in m)d[k+'/'+mm]=m[mm]});
 return d}
async function cloudSave(){
 try{const d=docsOf();for(const p in d){const j=JSON.stringify(d[p]);if(lastSaved[p]!==j){await cloud.doc(p).set({json:j});lastSaved[p]=j}}cloudStatus='cloud'}catch(e){cloudStatus='error'}
 paintStatus()}
async function initCloud(){
 try{
  const db=window.claude?await claude.use('db'):null;
  if(!db)return;
  const RESET='reset-1',meta=await db.doc('app/meta').get();
  if(!meta.exists||meta.data().reset!==RESET){
   for(const k of ['sales','purchases']){const q=await db.collection(k).get();for(const d of q.docs)await db.doc(k+'/'+d.id).set({json:'[]'})}
   S=seed();S.products.forEach(p=>{p.price=0;p.cost=0;p.stock=0;p.min=0});S.orders=[];
   try{localStorage.setItem('gestao-aguas',JSON.stringify(S))}catch(e){}
   lastSaved={};cloud=db;await cloudSave();
   if(cloudStatus==='error')return;
   await db.doc('app/meta').set({reset:RESET});
   cloudStatus='cloud';render();paintStatus();return}
  const first=await db.doc('app/products').get();
  if(first.exists){
   const raw=async p=>{const s=await db.doc(p).get();return s.exists?s.data().json:'[]'};
   const [pr,cu,su]=await Promise.all([raw('app/products'),raw('app/customers'),raw('app/suppliers')]);

function lerBackup(inp){

    S={products:d.products,customers:d.customers||[],suppliers:d.suppliers||[],sales:d.sales,purchases:d.purchases||[],orders:d.orders||[],vas:d.vas||0};
    migrateNums();save();render();alert('Backup restaurado.')},'Restaurar')
  }catch(e){alert('Arquivo inválido. Escolha um arquivo de backup do Sandro Águas.')}};
 r.readAsText(f)}

 try{
  const f=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Sandro Águas'});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 try{
  const dl=window.claude?await claude.use('downloads'):null;

function parsePedido(txt){
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const t=norm(txt),W={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10};
 const nums=[],re=/\b(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez)\b/g;let m;
 while((m=re.exec(t))){const q=/\d/.test(m[1])?parseInt(m[1]):W[m[1]];const after=t.slice(m.index+m[0].length,m.index+m[0].length+8);if(q===20&&/^\s*(l\b|litro)/.test(after))continue;nums.push({i:m.index,q,used:false})}
 const generic=['agua','mineral','adicionada','sais','garrafao','garrafoes','litros','litro'],occ=[];
 S.products.forEach(p=>{
  const ws=norm(p.name).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!/\d/.test(w));
  let keys=ws.filter(w=>!generic.includes(w));
  if(!keys.length)keys=ws.filter(w=>!['agua','garrafao','litros','litro'].includes(w));
  keys.forEach(k=>{let from=0,ix;while((ix=t.indexOf(k,from))>=0){occ.push({pid:p.id,i:ix});from=ix+k.length}})});
 occ.sort((a,b)=>a.i-b.i);
 const items={};
 occ.forEach((o,k)=>{
  const prev=k?occ[k-1].i:-1,next=k<occ.length-1?occ[k+1].i:t.length+1;
  let n=nums.filter(x=>!x.used&&x.i>prev&&x.i<o.i).pop();
  if(!n)n=nums.find(x=>!x.used&&x.i>o.i&&x.i<next);
  if(n)n.used=true;
  items[o.pid]=(items[o.pid]||0)+(n?n.q:1)});
 if(!Object.keys(items).length&&/\bagua(s)?\b/.test(t)){const pl=S.products.find(p=>norm(p.name).includes('plena')),last=S.sales[S.sales.length-1],pid=pl?pl.id:(last&&P(last.pid))?last.pid:(S.products[0]||{}).id;if(pid)items[pid]=nums.length?nums[0].q:1}
 const words=t.split(/[^a-z0-9]+/);
 const c=S.customers.find(c=>{const f=norm(c.name).split(/[^a-z0-9]+/)[0];return f.length>=3&&words.includes(f)});
 return {items,cid:c?c.id:''}}
function applyPaste(txt){

 if(!ids.length){alert('Não consegui identificar o produto na mensagem. Confira o texto ou preencha a venda manualmente.');pasteOpen=true;render();const e=document.getElementById('ptxt');if(e)e.value=txt||'';return}
 const resumo=ids.map(id=>r.items[id]+'× '+(P(id)?P(id).name:'')).join(', ');
 preParsed=r;pasteOpen=false;render();
 alert('Pedido interpretado: '+resumo+'. '+(r.cid?'Cliente: '+C(r.cid).name+'. ':'Escolha o cliente. ')+'Confira e toque em Registrar venda.')}

function delSale(id){if(!confirm('Excluir esta venda e devolver ao estoque?'))return;const s=S.sales.find(x=>x.id===id),p=P(s.pid);if(p)p.stock+=s.qty;S.sales=S.sales.filter(x=>x.id!==id);save();render()}
function delBuy(id){dlg('Excluir esta compra e retirar do estoque?',()=>{const s=S.purchases.find(x=>x.id===id),p=P(s.pid);if(p)p.stock-=s.qty;S.purchases=S.purchases.filter(x=>x.id!==id);save();render()},'Excluir')}
function updName(id,val){if(val.trim()){P(id).name=val.trim();save();render()}}
function upd(id,k,val){P(id)[k]=parseFloat(val)||0;save();render()}
function delProd(id){dlg('Remover este produto?',()=>{S.products=S.products.filter(p=>p.id!==id);save();render()},'Remover')}
function addProd(){const n=v('np').trim();if(!n){alert('Informe o nome do produto.');return}
 S.products.push({id:uid(),name:n,price:parseFloat(v('npp'))||0,cost:parseFloat(v('npc'))||0,stock:0,min:0});addingP=null;save();render()}
function addPessoa(k){const n=v('pn').trim();if(!n){alert('Informe o nome.');return}
 S[k].push({id:uid(),name:n,phone:v('pt').trim(),addr:v('pe').trim(),wa:!!(document.getElementById('pw')&&document.getElementById('pw').checked)});addingP=null;save();render()}
function editPessoa(id){editingP=id;render()}
function showAdd(k){addingP=k;render()}
function hideAdd(){addingP=null;render()}
function savePessoa(k,id){
 const n=v('pn2').trim();
 if(!n){alert('Informe o nome.');return}
 const c=S[k].find(x=>x.id===id);
 c.name=n;c.phone=v('pt2').trim();c.addr=v('pe2').trim();c.wa=!!(document.getElementById('pw2')&&document.getElementById('pw2').checked);
 editingP=null;save();render()}
function delPessoa(k,id){dlg('Excluir cadastro?',()=>{S[k]=S[k].filter(x=>x.id!==id);save();render()},'Excluir')}
migrateNums();render();paintStatus();initCloud();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
